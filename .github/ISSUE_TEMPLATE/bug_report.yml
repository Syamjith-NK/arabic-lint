name: Bug report
description: A crash, a missed finding, or output that does not match the file.
title: "Bug: "
labels:
  - bug
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Include the path you pointed it at and any flags.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output and exit code
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.3"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
