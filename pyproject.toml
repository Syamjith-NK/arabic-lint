[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-lint"
version = "0.6.0"
description = "Find Arabic text corrupted by reshape+bidi before it was stored. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Syamjith NK", email = "hello@syamjithnk.com" }]
keywords = ["arabic", "unicode", "bidi", "linter", "i18n", "rtl", "text-shaping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Arabic",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

# Test-only, and they must stay that way. The package itself has no runtime
# dependencies: it is pointed at environments where the dependency tree is the
# problem, and arabic-reshaper and python-bidi are the two libraries whose misuse it
# detects, so installing either alongside it would change the thing being measured.
# The suite needs them because it re-derives fixtures from the real reshaper rather
# than trusting a recorded mock of it.
[project.optional-dependencies]
test = ["pytest", "arabic-reshaper", "python-bidi"]

[project.urls]
Homepage = "https://github.com/Syamjith-NK/arabic-lint"
Issues = "https://github.com/Syamjith-NK/arabic-lint/issues"

[project.scripts]
arabic-lint = "arabic_lint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
