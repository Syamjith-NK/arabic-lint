name: arabic-lint
description: >-
  Find Arabic text corrupted by reshape+bidi before it was stored, and the Python source
  that will corrupt it at render time. Zero dependencies.
author: Syamjith NK

branding:
  icon: type
  color: green

inputs:
  path:
    description: File or directory to scan.
    required: false
    default: "."
  min-severity:
    description: >-
      stray, partial or reshaped. Applies to stored text only. The default is reshaped,
      which fails the job on a run of presentation forms (text that went through
      reshape+bidi before it was stored) while tolerating a single glyph pasted out of a
      PDF. Source findings are not graded by severity and are always reported.
    required: false
    default: reshaped
  args:
    description: >-
      Extra arguments, appended verbatim and split on whitespace. For example
      "--exclude vendor --exclude fixtures" or "--no-source".
    required: false
    default: ""
  version:
    description: >-
      Install this released version from PyPI instead of the code at the ref you pinned
      this action to. Leave empty to run the code at that ref, which is what the ref is
      for.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install arabic-lint
      shell: bash
      # Inputs are passed through the environment rather than interpolated into the
      # script, so a value containing shell metacharacters cannot become a command.
      env:
        AL_VERSION: ${{ inputs.version }}
        AL_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ -n "$AL_VERSION" ]; then
          python3 -m pip install --disable-pip-version-check --quiet "arabic-lint==$AL_VERSION"
        else
          python3 -m pip install --disable-pip-version-check --quiet "$AL_ACTION_PATH"
        fi
        arabic-lint --doctor

    - name: Run arabic-lint
      shell: bash
      env:
        AL_PATH: ${{ inputs.path }}
        AL_MIN_SEVERITY: ${{ inputs.min-severity }}
        AL_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        # AL_ARGS is intentionally unquoted: it is a list of arguments, not one argument.
        # shellcheck disable=SC2086
        arabic-lint "$AL_PATH" --min-severity "$AL_MIN_SEVERITY" $AL_ARGS
